services:
  connect-api:
    image: 1password/connect-api:1.8.3
    restart: unless-stopped
    volumes: &connect-volumes
      - ${XDG_CONFIG_HOME:-${HOME}/.config}/op/connect/1password-credentials.json:/home/opuser/.op/1password-credentials.json:ro
      - data:/home/opuser/.op/data
  connect-sync:
    image: 1password/connect-sync:1.8.3
    restart: unless-stopped
    volumes: *connect-volumes
volumes:
  data: {}
