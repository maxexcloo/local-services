name: Validate
on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  cancel-in-progress: true
  group: validate-${{ github.workflow }}-${{ github.ref }}
jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set Up Tools
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.9
      - name: Validate Configuration
        run: mise run check
