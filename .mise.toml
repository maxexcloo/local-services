[tools]
actionlint = "1.7.12"
prettier = "3.9.10"
shellcheck = "0.11.0"

# Development
[tasks.check]
description = "Check Compose Configuration & Formatting"
run = """
actionlint .github/workflows/*.yaml
docker compose --file onepassword-connect/compose.yaml config --quiet
prettier --check .
git diff --check
"""

[tasks.fmt]
description = "Format Project Files"
run = "prettier --write ."

# Setup
[tasks.setup]
description = "Install Development Tools"
run = "mise install"
