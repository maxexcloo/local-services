name: atvloadly
services:
  atvloadly:
    build: .
    init: true
    network_mode: host
    restart: unless-stopped
    environment:
      SERVICE_PORT: "5533"
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 10s
      timeout: 5s
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://localhost:5533/healthcheck
    security_opt:
      - seccomp=unconfined
    volumes:
      - data:/data
volumes:
  data:
    external: true
    name: atvloadly-data
